/* ===== HANDOFF README (for the next Claude/AI/dev) =====
 GOAL: "Lagos Drive" = the driving feature of the Nigerian life-sim "Lagos Life". Single-file three.js r128 game. Must feel real-Nigerian, look premium, and plug into Lagos Life with minimal work.
 V11: stronger acceleration and higher top speed; reduced speed drag; stronger speed camera feedback. V9: countdown revs while speed remains 0; green-light launch; speedometer reads actual ground speed; petrol station transaction UI with 10L/20L/full choices; Drift School gate challenges and progression.
 DONE: 4 garage cars + upgrades (engine/turbo/pops-bangs/tyres/NOS/transmission), health & repair costs, FUEL + petrol stations (₦/litre = ECON.fuel), 3 states (Lagos/Abuja/Port Harcourt) with traffic, danfo buses, okadas, pedestrians, traffic lights, potholes, kiosks, street lamps, day/night cycle + headlights, GTA-style rotating minimap with route line & blips, tap minimap = zoom, touch wheel OR arrow buttons (🎮 Controls) + pedals + handbrake lever + horn, drag race (win depends on hp/tyres/transmission/shift loss; AI from real hp tiers), drift zone with skid marks, car meet-up, ROAD TRIP highway between states (trucks, oncoming traffic to overtake, potholes, police checkpoint, fuel stop), arrival at a destination -> enterPlace().
 NIGERIA RULES MODELLED (researched): drive on the RIGHT. Red-light & speeding = instant camera ticket (no chase; Lagos LASTMA uses CCTV/TMS). Driving against traffic = LASTMA/police stop if an officer is near, else CCTV ticket. Serious crash = police stop. Police pursuit is rate-limited (rule.pcd = 90s cooldown). Highway checkpoint: slow down (<35km/h) or get fined. Potholes damage HP/tyres.
 V8: Collision response, roadside placement, sparse streetlights, Nigeria-time lighting, checkpoint choices and drag launch tuning. V5: Settings panel (⚙: controls, sensitivity, sound, graphics, rules). Balance = HOST.getMoney/setMoney (already tied to Lagos Life); fuel price = HOST.econ.fuel. Petrol stations are visible branded roadside forecourts and marked F on the minimap. Traffic lights show red/amber/green stacks. Roadside kiosks sit on pavements; vehicle collisions use oriented footprints.
 TODO (ask the owner before big choices): real Lagos Life car models/list (set LagosDriveHost.cars), real interiors (LagosDriveHost.enterPlace), BRT lane & seatbelt & bus-stop rules (LASTMA), speed bumps, rain/flood, keke tricycles, traffic jams at Third Mainland/Lekki, mechanic shop & fuel-queue/scarcity events, tyre wear, more states, more graphics (bloom/post-fx, better car models).
 IF ANYTHING HERE IS UNCLEAR OR YOU NEED A DECISION, DO NOT GUESS: MESSAGE THE OWNER AND ASK. Edit this file with small targeted patches; keep everything single-file; no localStorage in artifact previews (host.save handles persistence).
 EXTRA HOST HOOKS: enterPlace({id,name,state}) -> called on arrival (id = slug like 'cchub_yaba'; remap via LagosDriveHost.placeMap={'cchub_yaba':'cchub'}); call LagosDrive.resume() / exitPlace() when the player leaves the interior. onEvent also emits 'enter'.
 ===== */
/* ===== INTEGRATION (Lagos Life) =====
   Define window.LagosDriveHost BEFORE this script to plug into the main game. Every field is optional:
   {
     load():state|null          // saved garage/progress (same object you got from save)
     save(state)                // persist garage/progress — state = {cur, state, ctl, cars:[{own,up[6],paint,rim,spoil,glow,hp}]}
     getMoney():n  setMoney(n)  // wallet: point these at the main game's naira balance
     cars:[{n,price,p,body}]    // replace the garage list (n=name, price=naira, p=base hp, body=0..3 picks one of the 4 3D shapes)
     econ:{drift,trip,tripKm,drag}  // tune payouts
     onEvent(type,data)         // 'earn'|'pay'|'arrive'|'race' — for XP, missions, analytics
     onExit()                   // shows an Exit button and calls this when pressed
   }
   Control from outside: window.LagosDrive.pause() / resume() / getState() / goTo('Abuja')
   Default host = localStorage + own wallet. Everything else (physics, traffic, rules) is self-contained. ===== */
const $=i=>document.getElementById(i),V3=(x,y,z)=>new THREE.Vector3(x,y,z),rnd=(a,b)=>a+Math.random()*(b-a),cl=(v,a,b)=>Math.max(a,Math.min(b,v)),ri=a=>a[Math.floor(Math.random()*a.length)];
